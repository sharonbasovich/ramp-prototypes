name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
      - name: Build every present app into site/
        run: |
          set -euo pipefail
          mkdir -p site
          cp hub/index.html site/index.html
          for dir in apps/*/; do
            slug=$(basename "$dir")
            [ -f "$dir/package.json" ] || continue
            echo "=== building $slug ==="
            (cd "$dir" && npm ci && npm run build)
            mkdir -p "site/$slug"
            cp -r "$dir/dist/." "site/$slug/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
